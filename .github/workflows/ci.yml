name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  check:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas a SHA completo (supply-chain hardening / sha_pinning_required).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
        working-directory: goolemcode
      - run: go test ./...
        working-directory: goolemcode

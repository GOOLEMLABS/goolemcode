name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  check:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas a SHA completo (supply-chain hardening / sha_pinning_required).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
        working-directory: goolemcode
      - run: go test ./...
        working-directory: goolemcode
